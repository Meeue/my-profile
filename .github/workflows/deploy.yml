# Deploys the profile app to GitHub Pages on every push to main.
#
# Setup (once): Settings > Pages > Source: GitHub Actions.
# Settings > Secrets and variables > Actions:
#   Variables: CMS_SPACE
#   Secrets:   OMDB_KEY, CMS_TOKEN
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The Flutter project lives in the SODUSTA_UNIT8_EXERCISE subfolder.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SODUSTA_UNIT8_EXERCISE
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the web app
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=OMDB_KEY=${{ secrets.OMDB_KEY }}
          --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }}
          --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SODUSTA_UNIT8_EXERCISE/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4